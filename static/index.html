<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刷题工具</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--ink:#1f2328;--muted:#6b7280;--line:#e5e7eb;
    --brand:#c0392b;--brand-soft:#fdecea;--ok:#1a7f37;--ok-bg:#e8f5ec;--err:#c0392b;--err-bg:#fdecea;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px;}

  header.top{background:linear-gradient(135deg,#c0392b,#8e2418);color:#fff;border-radius:16px;
    padding:22px 20px;box-shadow:var(--shadow);margin-bottom:16px;position:relative;}
  header.top h1{margin:0 0 4px;font-size:22px;font-weight:700;}
  header.top .sub{opacity:.92;font-size:13px;}
  .total-stat{margin-top:10px;display:inline-block;background:rgba(255,255,255,.18);
    border:1px solid rgba(255,255,255,.35);padding:6px 14px;border-radius:999px;
    font-size:14px;font-weight:600;}
  header.top .logout{position:absolute;top:16px;right:16px;font-size:13px;color:#fff;opacity:.9;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);border-radius:999px;
    padding:5px 12px;cursor:pointer;font-family:inherit;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .card h2{margin:0 0 8px;font-size:16px;}
  .hint{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
  input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:11px 12px;font-size:14px;font-family:inherit;margin-bottom:8px;}
  input:focus{outline:none;border-color:var(--brand);}
  textarea{width:100%;min-height:76px;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:13px;font-family:inherit;resize:vertical;margin-bottom:10px;line-height:1.6;}
  textarea:focus{outline:none;border-color:var(--brand);}
  .filebtn{display:block;width:100%;text-align:center;border:1.5px dashed #c9ccd1;border-radius:10px;
    padding:12px;font-size:14px;color:var(--brand);cursor:pointer;background:#fafbfc;margin-bottom:8px;}
  .filebtn.done{border-style:solid;border-color:var(--ok);color:var(--ok);background:var(--ok-bg);}
  .btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:transform .05s;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(192,57,43,.28);}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .switch{font-size:13px;color:var(--brand);text-align:center;margin-top:10px;cursor:pointer;}
  #msg{margin-top:12px;font-size:14px;padding:12px;border-radius:10px;display:none;}
  #msg.ok{display:block;background:var(--ok-bg);color:var(--ok);border:1px solid #b7dfc3;}
  #msg.err{display:block;background:var(--err-bg);color:var(--err);border:1px solid #f2c4bf;}

  .cat{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .cat-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;margin-bottom:12px;}
  .cat-title .cat-name{flex:1;}
  .cat-title .cat-sub{font-size:12px;color:var(--muted);font-weight:400;}
  .total-card{display:flex;align-items:center;gap:12px;text-decoration:none;border-radius:12px;
    padding:14px 16px;margin-bottom:12px;background:linear-gradient(135deg,#c0392b,#8e2418);
    color:#fff;box-shadow:0 4px 14px rgba(192,57,43,.28);}
  .total-card .icon{font-size:26px;line-height:1;}
  .total-card .text{flex:1;min-width:0;}
  .total-card .main{font-size:16px;font-weight:700;}
  .total-card .sub{font-size:12.5px;opacity:.92;margin-top:2px;}
  .total-card .tarrow{font-size:24px;font-weight:700;flex:none;}
  .quiz-link{display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px;}
  .quiz-link .year{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);
    background:var(--brand-soft);padding:2px 9px;border-radius:999px;margin-right:8px;}
  .quiz-link .t{font-size:15px;font-weight:600;}
  .quiz-link .meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .quiz-link .arrow{float:right;color:var(--brand);font-weight:700;font-size:18px;}
  .empty{text-align:center;color:var(--muted);padding:30px 20px;font-size:14px;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-top-color:transparent;
    border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px;}
  @keyframes r{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <!-- 登录视图 -->
  <div id="loginView">
    <header class="top" style="margin-top:20px;">
      <h1>刷题工具</h1>
      <div class="sub">真题 PDF 一键变在线刷题 · 自动判分 · 错题解析</div>
    </header>
    <div class="card">
      <h2 id="loginTitle">登录</h2>
      <input type="text" id="username" placeholder="用户名">
      <input type="password" id="password" placeholder="密码">
      <button class="btn primary" id="loginBtn" onclick="doAuth()">登录</button>
      <div class="switch" onclick="toggleMode()">没有账号？<span id="switchTxt">去注册</span></div>
      <div id="msg"></div>
    </div>
  </div>

  <!-- 主视图 -->
  <div id="mainView" style="display:none;">
    <header class="top">
      <h1>刷题工具</h1>
      <div class="sub" id="welcome"></div>
      <div class="total-stat" id="totalStat">已上传 0 道题</div>
      <button class="logout" onclick="logout()">退出登录</button>
    </header>

    <div class="card">
      <h2>上传新真题</h2>
      <input type="text" id="subject" placeholder="科目（如：马克思主义基本原理）">
      <input type="text" id="year" placeholder="年份/批次（如：2026年）">
      <div class="filebtn" id="paperBtn" onclick="document.getElementById('paper').click()">📄 选择「试卷」文件</div>
      <input type="file" id="paper" accept=".pdf,.docx,.doc,.txt" style="display:none">
      <textarea id="paperText" placeholder="文件识别不了时，可直接粘贴「试卷」文字…"></textarea>
      <div class="filebtn" id="ansBtn" onclick="document.getElementById('answer').click()">📝 选择「答案」文件（可选）</div>
      <input type="file" id="answer" accept=".pdf,.docx,.doc,.txt" style="display:none">
      <textarea id="ansText" placeholder="或粘贴「答案/解析」文字…"></textarea>
      <button class="btn primary" id="submitBtn" onclick="doUpload()">上传并生成答题页</button>
      <div id="uploadMsg"></div>
    </div>

    <div id="list"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('token') || '';
let mode = 'login';   // login | register
let paperFile = null, ansFile = null;

function api(path, opts={}){
  const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, Object.assign({}, opts, {headers}));
}
async function handle401(r){
  if (r.status === 401){ logout(); throw new Error('登录已过期'); }
  return r;
}

// ---------- 登录/注册 ----------
function toggleMode(){
  mode = mode === 'login' ? 'register' : 'login';
  document.getElementById('loginTitle').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('loginBtn').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('switchTxt').textContent = mode === 'login' ? '去注册' : '去登录';
}
function showMsg(el, text, cls){ const m = document.getElementById(el); m.textContent = text; m.className = cls; }

async function doAuth(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password){ showMsg('msg','请输入用户名和密码','err'); return; }
  const btn = document.getElementById('loginBtn'); btn.disabled = true;
  try {
    const r = await api('/api/' + mode, {method:'POST', body: JSON.stringify({username, password})});
    const j = await r.json();
    if (j.ok){ token = j.token; localStorage.setItem('token', token); enterMain(username); }
    else showMsg('msg', j.detail || '操作失败', 'err');
  } catch(e){ showMsg('msg','网络错误，请稍后重试','err'); }
  finally { btn.disabled = false; }
}

function enterMain(username){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  document.getElementById('welcome').textContent = '欢迎，' + username;
  loadList();
}
function logout(){
  token = ''; localStorage.removeItem('token');
  document.getElementById('mainView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}

// ---------- 上传 ----------
document.getElementById("paper").addEventListener("change", e => {
  paperFile = e.target.files[0] || null;
  const b = document.getElementById("paperBtn");
  b.textContent = paperFile ? "📄 " + paperFile.name : "📄 选择「试卷」文件";
  b.classList.toggle("done", !!paperFile);
});
document.getElementById("answer").addEventListener("change", e => {
  ansFile = e.target.files[0] || null;
  const b = document.getElementById("ansBtn");
  b.textContent = ansFile ? "📝 " + ansFile.name : "📝 选择「答案」文件（可选）";
  b.classList.toggle("done", !!ansFile);
});
function fileToBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function doUpload(){
  const paperText = document.getElementById("paperText").value.trim();
  const ansText = document.getElementById("ansText").value.trim();
  if (!paperFile && !paperText){ showMsg('uploadMsg','请选择「试卷」文件，或粘贴试卷文字','err'); return; }
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>解析中…';
  showMsg('uploadMsg','','');
  try {
    const body = {
      subject: document.getElementById("subject").value,
      year: document.getElementById("year").value,
      paper: paperText ? { text: paperText } : { filename: paperFile.name, data: await fileToBase64(paperFile) },
    };
    if (ansText) body.answer = { text: ansText };
    else if (ansFile) body.answer = { filename: ansFile.name, data: await fileToBase64(ansFile) };
    const r = await handle401(await api('/api/upload', {method:'POST', body: JSON.stringify(body)}));
    const j = await r.json();
    if (j.ok){ showMsg('uploadMsg','✅ 生成成功：' + j.total + ' 题（' + j.answered + ' 题带答案）','ok'); loadList(); }
    else showMsg('uploadMsg','失败：' + (j.detail || j.error || '未知错误'),'err');
  } catch(e){ showMsg('uploadMsg', e.message === '登录已过期' ? '登录已过期' : '解析失败','err'); }
  finally { btn.disabled = false; btn.textContent = '上传并生成答题页'; }
}

// ---------- 列表 ----------
async function loadList(){
  try {
    const r = await handle401(await api('/api/list'));
    const j = await r.json();
    renderList(j.data || []);
  } catch(e){ renderList(null); }
}
function renderList(subjects){
  const total = (subjects||[]).reduce((a,s)=>a+s.quizzes.reduce((x,y)=>x+y.total,0),0);
  const ts = document.getElementById("totalStat");
  if (ts) ts.textContent = '已上传 ' + total + ' 道题';
  const el = document.getElementById("list");
  if (!subjects || !subjects.length){
    el.innerHTML = '<div class="empty">还没有题库。上传第一份真题后，这里会按「科目 → 年份」分类显示。</div>';
    return;
  }
  el.innerHTML = subjects.map(s => {
    const tot = s.quizzes.reduce((a,b)=>a+b.total,0);
    return `<div class="cat">
      <div class="cat-title">
        <span class="cat-name">${esc(s.subject)}</span>
        <span class="cat-sub">${s.quizzes.length} 份 · ${tot} 题</span>
      </div>
      <a class="total-card" href="practice.html?subject=${encodeURIComponent(s.subject)}">
        <div class="icon">🎯</div>
        <div class="text">
          <div class="main">汇总刷题 · 反复练习</div>
          <div class="sub">你上传的所有内容，打乱顺序，在这里反复练习（共 ${tot} 题）</div>
        </div>
        <div class="tarrow">›</div>
      </a>
      ${s.quizzes.map(q => `
        <a class="quiz-link" href="${q.href}">
          <span class="arrow">›</span>
          <span class="year">${esc(q.year)}</span>
          <span class="t">${esc(q.title)}</span>
          <div class="meta">${q.total} 题 · ${q.answered} 题带答案</div>
        </a>`).join("")}
    </div>`;
  }).join("");
}
function esc(s){ return (s||"").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

// 启动
if (token){ document.getElementById('loginView').style.display='none'; document.getElementById('mainView').style.display='block'; loadList(); }
</script>
</body>
</html>
